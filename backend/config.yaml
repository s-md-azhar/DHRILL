# DHRILL Pipeline Configuration
# Config-driven parameters for ML inference, thresholds, and fallback providers

models:
  nli:
    name: "cross-encoder/nli-deberta-v3-small"
    device: "auto" # "cuda", "cpu", or "auto"
    max_length: 512
    batch_size: 16
  embedding:
    name: "sentence-transformers/all-MiniLM-L6-v2"
    device: "auto"
    dimension: 384

pipeline:
  # Micro-indexing chunking parameters
  chunk_size_sentences: 2
  chunk_overlap_sentences: 1
  retrieval_top_k: 3
  
  # Decision thresholds (empirically calibrated against HaluEval/FEVER validation splits)
  neutral_ambiguity_threshold: 0.60
  contradiction_delta_margin: 0.10
  high_confidence_contradiction: 0.45
  high_confidence_entailment: 0.70
  
  # Feature toggles
  enable_entity_sieve: true
  enable_api_arbitration: true
  enable_claim_decomposition_escalation: true
  syntactic_complexity_threshold: 3 # Clause depth to trigger escalation

cache:
  enabled: true
  cache_dir: ".cache/dhrill"
  max_size_mb: 500
  ttl_seconds: 604800 # 7 days

providers:
  fallback_chain:
    - "gemini"
    - "groq"
    - "openrouter"
    - "local_rule"
  gemini:
    model: "gemini-3.8-flash"
    timeout_sec: 6.0
    max_retries: 2
    rpm_limit: 12
  groq:
    model: "llama-3.3-70b-versatile"
    timeout_sec: 5.0
    max_retries: 2
    rpm_limit: 25
  openrouter:
    model: "openrouter/free"
    timeout_sec: 6.0
    max_retries: 1
    rpm_limit: 15

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:3000"
