version: '3.8'

services:
  dhrill:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dhrill-app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - dhrill-cache:/root/.cache/dhrill
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  dhrill-cache:
    name: dhrill-cache
  hf-cache:
    name: dhrill-hf-cache
